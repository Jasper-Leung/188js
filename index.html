<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!--
      禁止 MIME 嗅探。这一条是给装了 IDM 之类下载管理器的机器准备的：
      没有它时，浏览器（以及挂在浏览器上的下载器）可能把 .glb / .ogg
      当成"未知类型 → 下载"，于是每条资源都弹一次下载框。
      资源本身都已经是 fetch/XHR 拿的、不是导航，声明清楚类型就没人会来抢。
    -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="theme-color" content="#e8e0cd" />
    <!--
      description / title 的静态值是**英语**，因为首屏那一瞬还没有
      任何脚本跑过（见下方 `<body>` 开头的内联脚本，它负责把语言
      在第一次绘制之前定下来）。JS 一跑起来就会用 `t('game_title')`
      覆写 title；这段静态值只活在"内联脚本都没执行"的那一瞬。
    -->
    <meta
      name="description"
      content="Gift No.188 - a 3D ride. Gather fifteen moments into a postcard you can write on and export."
    />
    <title>Gift No.188</title>

    <!--
      字体。24MB 的全量字库被子集成了两份：
        ui          181KB，只含游戏里真正出现过的字符，首屏加载
        handwriting 404KB，常用 3500 字，只在打开明信片背面手写时加载

      两份都是 woff2，而且是子集化之后再 woff2 化的，所以体积是原文件的
      0.7%。低配玩家往往也是慢网络玩家——一个光等字体的启动屏，
      在 3G 上是二十秒起步。
    -->
    <link rel="preload" href="fonts/ui.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      骨架与 @font-face 走这条**渲染阻塞**的样式表，而不是由 JS import。
      差别在首屏：JS 加载完之前，启动屏必须已经是深色的、有字、有进度条；
      走 JS 的话那半秒多是一屏白，而白屏在慢网络上是"这游戏卡死了"的第一印象。
    -->
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <!--
      首屏语言探测 —— **必须在第一次绘制之前把字定下来**。

      模块脚本（`/src/main.ts`）要等整份 HTML 解析完才执行，而启动屏在那
      之前就已经 paints 了。所以只靠 `applyStaticI18n()` 是不够的：中文
      玩家会先看到一瞬英语占位，然后"跳"成中文——而启动屏是玩家对第一
      印象唯一来得及做判断的地方。

      优先级与 `src/i18n/index.ts` 的 `initLang()` 完全一致：
      **localStorage 存档 > 系统语言 > 'en'**。两边走同一套规则，
      所以不存在"首屏中文、进了标题页变英文"的第二跳。

      `__bootI18n` 是 `data/generated/i18n.json` 的**首屏镜像副本**——
      模块脚本还没跑，拿不到那张表。它只有 5 个键，而 `verify_i18n`
      逐键比着表守着（改表忘了改这里会红）。
    -->
    <!--
      `nonce="__TAURI_SCRIPT_NONCE__"` 是给 **Tauri 桌面端** 看的。

      桌面包带 CSP（`src-tauri/tauri.conf.json`），而这段是**内联脚本**——
      `script-src 'self'` 会把它拦掉，于是首屏语言探测不跑，
      标题页会先闪一屏没有翻译的字。Tauri v2 的做法是把这段占位符
      换成随机 nonce、并把 `'nonce-...'` 自动加进它的 `script-src`
      （`tauri::manager::set_csp` → `replace_csp_nonce`）。

      网页版（GitHub Pages / `npm run dev`）不设 CSP，这个属性是惰性的，
      脚本照跑——所以两边行为一致。
    -->
    <script nonce="__TAURI_SCRIPT_NONCE__">
      /*BOOT-I18N-BEGIN*/
      window.__bootI18n = {"zh":{"game_title":"188号礼物","boot_title_head":"188","boot_title_mark":"号","boot_title_tail":"礼物","boot_sub":"正在铺路…"},"en":{"game_title":"Gift No.188","boot_title_head":"Gift","boot_title_mark":"No.","boot_title_tail":"188","boot_sub":"Paving the road..."}};
      /*BOOT-I18N-END*/
      (function () {
        var lang = 'en';
        try {
          var saved = localStorage.getItem('gift188.lang');
          if (saved === 'zh' || saved === 'en') {
            lang = saved;
          } else {
            var tag = (navigator.languages && navigator.languages[0]) || navigator.language || '';
            lang = /^zh/i.test(tag) ? 'zh' : 'en';
          }
        } catch (e) {
          /* 隐私模式下 localStorage 会抛：保持 en，与 systemLang() 的回退一致 */
        }
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        var T = window.__bootI18n[lang];
        document.title = T.game_title;
        var spans = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < spans.length; i++) {
          var k = spans[i].getAttribute('data-i18n');
          if (T[k] !== undefined) spans[i].textContent = T[k];
        }
      })();
    </script>

    <!-- 3D 画布。尺寸由 Renderer 按 renderScale 决定 -->
    <canvas id="stage" aria-label="3D world"></canvas>

    <!-- UI 根节点：标题、HUD、对白、面板、触屏、遮罩全挂在这里 -->
    <div id="ui-root"></div>

    <!--
      启动屏。
      它不是装饰：地形高程场、路面三角形索引、植被块这些都要在
      第一个可交互画面之前算好（合起来约 300~600ms），这段时间里
      屏幕上得有东西可看，而不是白屏。

      这里的字是**英语占位**，随后由 `<body>` 开头的内联脚本按
      存档/系统语言覆写（模块脚本执行时 `applyStaticI18n()` 会再覆写
      一遍同样的值——幂等，不产生第二跳）。
      标题拆成三段是刻意的：`boot-num` 那一段带颜色，
      中文是「188[号]礼物」、英语是「Gift [No.]188」。
    -->
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-inner">
        <div class="boot-title"><span data-i18n="boot_title_head"></span><span class="boot-num" data-i18n="boot_title_mark"></span><span data-i18n="boot_title_tail"></span></div>
        <div class="boot-sub" id="boot-sub" data-i18n="boot_sub"></div>
        <div class="boot-bar"><i id="boot-fill"></i></div>
        <div class="boot-pct" id="boot-pct">0%</div>
      </div>
    </div>

    <!--
      noscript 的内容**永远**不会被 i18n 覆盖：它只在 JS 被关掉时才显示，
      而那时没有任何脚本能翻译它。所以这里只能两种语言并排写死——
      少写一种就等于那一半玩家看不到提示。
    -->
    <noscript>
      <div class="noscript">
        这个游戏需要 JavaScript 与 WebGL 2。 / This game needs JavaScript and WebGL 2.
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
